# docker-compose.dev.yml
version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: heightt-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heightt_db_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - heightt-network-dev
    restart: unless-stopped

  # ============================================
  # PGAdmin (Optional - for development)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: heightt-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@heightt.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - heightt-network-dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
networks:
  heightt-network-dev:
    driver: bridge
